version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    groups:
      # Packages that have to move together with React Native. Patch releases
      # come as one PR; minor/major upgrades are done by hand (see `ignore`).
      react-native:
        patterns:
          - "react-native"
          - "@react-native/*"
          - "@react-native-community/cli*"
          - "react"
          - "react-dom"
          - "react-test-renderer"
          - "react-native-test-app"
          - "react-native-web"
          - "expo"
          - "@expo/*"
        update-types:
          - patch
      # Everything else: batch minor/patch updates into one PR. Majors still
      # get their own PRs.
      dev-dependencies:
        dependency-type: development
        exclude-patterns:
          - "react-native"
          - "@react-native/*"
          - "@react-native-community/cli*"
          - "react"
          - "react-dom"
          - "react-test-renderer"
          - "react-native-test-app"
          - "react-native-web"
          - "expo"
          - "@expo/*"
          - "flow-bin"
        update-types:
          - minor
          - patch
    ignore:
      # Upgraded together with React Native (the versions are tied to each
      # other, and Expo SDKs target one React Native version).
      - dependency-name: "react-native"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@react-native/*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@react-native-community/cli*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react-test-renderer"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react-native-test-app"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react-native-web"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "expo"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@expo/*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # React Native's bundled Flow libdefs are written for the Flow version
      # React Native itself uses, so flow-bin follows React Native upgrades
      # (0.x minors are breaking). See #933.
      - dependency-name: "flow-bin"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
