buildscript {
    def androidTestAppDir = new File(gradle.ext.resolvePackageDir("react-native-test-app"), "android")
    apply(from: new File(androidTestAppDir, "dependencies.gradle"))

    repositories {
        mavenCentral()
        google()
    }

    dependencies {
        classpath "com.android.tools.build:gradle:$androidPluginVersion"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion"
    }
}

allprojects {
    repositories {
        maven {
            // All of React Native (JS, Obj-C sources, Android binaries) is installed from npm
            url(new File(gradle.ext.resolvePackageDir("react-native"), "android"))
        }
        mavenCentral()
        google()
    }

    // React Native 0.63 depends on Fresco 2.2.0, which was only ever published
    // to JCenter (now shut down). 2.3.0 is the oldest release on Maven Central.
    configurations.all {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == "com.facebook.fresco" && details.requested.version == "2.2.0") {
                details.useVersion("2.3.0")
                details.because("Fresco 2.2.0 is not available on Maven Central")
            }
        }
    }
}
